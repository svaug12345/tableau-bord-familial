<!DOCTYPE html>
<!--
=====================================================================
  TABLEAU DE BORD FAMILIAL — SV
  Version : 1.2.1
  Auteur  : svaug12345
  Cible   : Samsung Smart Monitor M7 32" (Tizen) + navigateur / téléphone
---------------------------------------------------------------------
  POC (proof of concept) : une seule page HTML autonome.
  Aucune dépendance obligatoire : tout tient dans ce fichier
  (seules les polices viennent de Google Fonts, avec repli si hors ligne).
  Parfait pour être empaqueté plus tard en appli Tizen (.wgt).

  CE QUI EST BRANCHÉ POUR DE VRAI :
    - Horloge + date (JavaScript natif, mise à jour chaque seconde)
    - Météo en direct (API Open-Meteo, gratuite, sans clé)
    - Saint du jour (table embarquée, fonctionne hors ligne)
    - Compte à rebours avant les prochaines vacances scolaires

  CE QUI EST EN "DÉMO" POUR L'INSTANT (données écrites en dur) :
    - Les corvées / pense-bête  -> à brancher sur le NAS plus tard

  POUR PERSONNALISER : voir le bloc CONFIG dans le <script> en bas.

  HISTORIQUE
    1.2.1 — Adresse courte pour le navigateur de la TV (index.html
            qui redirige vers cette page, via GitHub Pages).
    1.2.0 — Version appli TV Samsung (dossier tizen/) : touche Retour
            pour quitter, écran qui ne se met plus en veille.
    1.1.0 — Vrai logo SV (le geste au pinceau, sv-mark), écran de
            lancement où le trait se dessine, couleurs et polices
            alignées sur la charte SV officielle (thème sombre,
            Manrope + JetBrains Mono).
    1.0.0 — Premier POC.
=====================================================================
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport : indispensable pour que l'affichage s'adapte à l'écran -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord familial — SV</title>

  <!-- Icône d'onglet : l'icône SV sombre (tuile nuit + geste turquoise) -->
  <link rel="icon" type="image/svg+xml" href="assets/logos/sv-icon-dark.svg">

  <!-- Polices de la charte SV (gratuites, Google Fonts) :
       Manrope pour le texte, JetBrains Mono pour les chiffres.
       Si l'écran est hors ligne, le navigateur prend la police système. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">

  <style>
    /* =================================================================
       CHARTE GRAPHIQUE "SV" — thème SOMBRE
       -----------------------------------------------------------------
       Les valeurs viennent directement des "tokens" de la charte SV
       (design system SV). Un écran allumé en permanence dans le salon
       = thème sombre : moins éblouissant le soir, et ça use moins la
       dalle. Tu changes une valeur ici -> toute l'appli suit.
       ================================================================= */
    :root {
      /* --- Couleurs (tokens SV, thème sombre) --- */
      --surface:        #0e1a1c;  /* fond de page */
      --surface-raised: #152427;  /* fond des cartes posées sur le fond */
      --line:           #26393c;  /* filets et bordures de 1px */
      --ink:            #e6f1f1;  /* texte principal (et logo sur fond sombre) */
      --ink-muted:      #9db3b5;  /* texte secondaire, légendes, crédits */
      --teal:           #3cc2b8;  /* couleur de marque */
      --teal-deep:      #1d6b6e;  /* grands aplats */
      --teal-soft:      #1c4245;  /* zone mise en avant */
      --accent:         #5fe0d2;  /* turquoise vif : le geste, petites touches */
      --danger:         #f0857f;  /* erreurs (toujours avec un mot) */

      /* --- Polices --- */
      --font-sans: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

      /* --- Espacements et arrondis (tokens SV) --- */
      --space-2: 8px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;   /* marges d'écran sur grand écran */
      --space-12: 48px;
      --radius-md: 12px; /* boutons, cartes */
    }

    /* Remise à zéro de base : pas de marges surprises */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      padding: var(--space-8);
      user-select: none;   /* rien de sélectionnable à la télécommande */
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* =================================================================
       ÉCRAN DE LANCEMENT (règle de la charte : le geste centré, en
       "accent" sur fond sombre, ~1 seconde, le trait se dessine de
       gauche à droite).
       Astuce : on ne "dessine" pas vraiment le tracé (c'est une forme
       pleine, pas un trait). On le cache derrière un masque, puis on
       agrandit le masque de gauche à droite : l'effet est le même.
       ================================================================= */
    #lancement {
      position: fixed;
      inset: 0;                       /* plein écran */
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease;  /* fondu à la sortie */
    }
    #lancement.cache { opacity: 0; pointer-events: none; }
    #lancement svg {
      width: min(30vw, 260px);
      color: var(--accent);           /* le geste prend currentColor */
    }
    /* le rectangle du masque part de largeur 0 et s'étire jusqu'à 64
       (la largeur du dessin) en 0,9 s */
    #masque-rect { animation: dessin 0.9s ease-out forwards; }
    @keyframes dessin { from { width: 0; } to { width: 64px; } }

    /* ---------- EN-TÊTE : salutation + date à gauche, heure à droite ---------- */
    /* Pas de logo ici : la charte veut un geste discret, jamais collé
       à du texte. Il est en bas de page, en petit. */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: var(--space-6);
      flex-wrap: wrap;                 /* passe à la ligne sur téléphone */
      margin-bottom: var(--space-8);
    }
    .salutation {
      font-size: clamp(1.4rem, 3vw, 2rem);  /* style h1 de la charte */
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .date {
      color: var(--ink-muted);
      font-size: clamp(1rem, 2vw, 1.3rem);
      margin-top: var(--space-2);
    }
    .date::first-letter { text-transform: uppercase; } /* "Dimanche…" */

    /* L'heure : les chiffres en JetBrains Mono (même largeur pour tous,
       donc rien ne "tremble" quand les minutes changent). Une seule
       couleur, comme le veut la charte : pas de dégradé. */
    .heure {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: clamp(3.5rem, 11vw, 8rem);
      line-height: 1;
      color: var(--ink);
      letter-spacing: -0.03em;
    }
    .heure .sec { color: var(--teal); }  /* les ":" en couleur de marque */

    /* ---------- GRILLE DE CARTES ---------- */
    /* auto-fit : le nombre de colonnes s'adapte à la largeur dispo */
    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--space-6);
      flex: 1;
      align-content: start;
    }

    .carte {
      background: var(--surface-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      animation: apparition 0.6s ease both;
    }
    /* chaque carte arrive un poil après la précédente */
    .carte:nth-child(2) { animation-delay: 0.08s; }
    .carte:nth-child(3) { animation-delay: 0.16s; }
    .carte:nth-child(4) { animation-delay: 0.24s; }
    @keyframes apparition {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Titre de carte = style "label" de la charte (capitales espacées) */
    .carte h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--teal);
      margin-bottom: var(--space-4);
    }

    /* ---------- CARTE MÉTÉO ---------- */
    .meteo-actuel {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }
    .meteo-icone { font-size: 3.2rem; line-height: 1; }
    .meteo-temp  { font-family: var(--font-mono); font-size: 2.6rem; font-weight: 700; }
    .meteo-desc  { color: var(--ink-muted); font-size: 0.95rem; }

    .meteo-jours { display: flex; justify-content: space-between; gap: var(--space-2); }
    .meteo-jour  { text-align: center; flex: 1; }
    .meteo-jour .j     { color: var(--ink-muted); font-size: 0.8rem; text-transform: capitalize; }
    .meteo-jour .i     { font-size: 1.6rem; margin: 4px 0; }
    .meteo-jour .t-max { font-family: var(--font-mono); font-weight: 700; }
    .meteo-jour .t-min { font-family: var(--font-mono); color: var(--ink-muted); font-size: 0.85rem; }

    /* ---------- CARTE SAINT DU JOUR ---------- */
    .saint-nom  { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; }
    .saint-info { color: var(--ink-muted); margin-top: 6px; }

    /* ---------- CARTE COMPTE À REBOURS ---------- */
    /* Cette carte est "mise en avant" : fond teal-soft */
    .carte.relief { background: var(--teal-soft); border-color: transparent; }
    .carte.relief h2 { color: var(--ink); }
    .rebours-nb {
      font-family: var(--font-mono);
      font-size: 3.6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .rebours-label { color: var(--ink); margin-top: var(--space-2); }
    .rebours-cible { margin-top: 4px; font-size: 0.9rem; color: var(--ink-muted); }

    /* ---------- CARTE PENSE-BÊTE (démo) ---------- */
    .liste { list-style: none; }
    .liste li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 1.05rem;
    }
    .liste li:last-child { border-bottom: none; }
    .puce {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }

    /* ---------- PIED DE PAGE ---------- */
    /* Charte : dans les crédits, le geste en petit (32px), couleur
       ink-muted, SANS texte collé. Le numéro de version est donc
       posé à l'autre bout de la ligne, bien séparé. */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--space-8);
      color: var(--ink-muted);
    }
    footer svg { width: 32px; height: 32px; color: var(--ink-muted); }
    footer .version { font-family: var(--font-mono); font-size: 0.8rem; }

    /* =================================================================
       GRAND ÉCRAN (le M7 en 32") : 2 colonnes x 2 lignes qui remplissent
       toute la hauteur, et tout est agrandi pour être lisible de loin.
       "@media" = ces règles ne s'appliquent que si l'écran est assez large.
       ================================================================= */
    @media (min-width: 1200px) {
      .grille {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 1fr;        /* les 2 lignes ont la même hauteur */
        align-content: stretch;     /* et s'étirent jusqu'en bas */
      }
      .carte { padding: var(--space-8); display: flex; flex-direction: column; }
      .carte h2 { font-size: 1rem; margin-bottom: var(--space-6); }
      .meteo-icone  { font-size: 5rem; }
      .meteo-temp   { font-size: 4rem; }
      .meteo-desc   { font-size: 1.2rem; }
      .meteo-jours  { margin-top: auto; }   /* prévisions calées en bas */
      .meteo-jour .i     { font-size: 2.4rem; }
      .meteo-jour .j     { font-size: 1rem; }
      .meteo-jour .t-max { font-size: 1.4rem; }
      .meteo-jour .t-min { font-size: 1.1rem; }
      .saint-nom  { font-size: 4rem; margin-top: auto; }
      .saint-info { font-size: 1.3rem; margin-bottom: auto; }
      .rebours-nb { font-size: 8rem; margin-top: auto; }
      .rebours-label { font-size: 1.4rem; }
      .rebours-cible { font-size: 1.2rem; margin-bottom: auto; }
      .liste li { font-size: 1.4rem; padding: 14px 0; }
    }

    /* message d'erreur (ex : météo non chargée) */
    .erreur { color: var(--danger); font-size: 0.9rem; }
  </style>
</head>

<body>

  <!-- ================= ÉCRAN DE LANCEMENT ================= -->
  <div id="lancement">
    <svg viewBox="0 0 64 64" aria-label="SV">
      <defs>
        <!-- masque : seul ce qui est sous le rectangle blanc est visible -->
        <mask id="masque">
          <rect id="masque-rect" x="0" y="0" width="0" height="64" fill="#fff"/>
        </mask>
      </defs>
      <use href="#sv-geste" mask="url(#masque)"/>
    </svg>
  </div>

  <!-- ================= EN-TÊTE ================= -->
  <header>
    <div>
      <div class="salutation" id="salutation">Bonjour la famille</div>
      <div class="date" id="date-complete">chargement…</div>
    </div>
    <div class="heure" id="heure">--<span class="sec">:</span>--</div>
  </header>

  <!-- ================= GRILLE DE CARTES ================= -->
  <div class="grille">

    <!-- Carte 1 : MÉTÉO -->
    <div class="carte">
      <h2>Météo</h2>
      <div id="meteo-contenu">
        <div class="meteo-desc">Chargement de la météo…</div>
      </div>
    </div>

    <!-- Carte 2 : SAINT DU JOUR -->
    <div class="carte">
      <h2>Saint du jour</h2>
      <div class="saint-nom" id="saint-nom">—</div>
      <div class="saint-info" id="saint-info"></div>
    </div>

    <!-- Carte 3 : COMPTE À REBOURS VACANCES (mise en avant) -->
    <div class="carte relief">
      <h2>Prochaines vacances</h2>
      <div class="rebours-nb" id="rebours-nb">—</div>
      <div class="rebours-label" id="rebours-label">jours</div>
      <div class="rebours-cible" id="rebours-cible"></div>
    </div>

    <!-- Carte 4 : PENSE-BÊTE (démo - données en dur) -->
    <div class="carte">
      <h2>À ne pas oublier</h2>
      <ul class="liste" id="liste-corvees">
        <!-- rempli par le JavaScript depuis la CONFIG -->
      </ul>
    </div>

  </div>

  <!-- ================= PIED DE PAGE ================= -->
  <footer>
    <!-- le geste seul, en petit, sans texte collé -->
    <svg viewBox="0 0 64 64" aria-label="SV"><use href="#sv-geste"/></svg>
    <span class="version">v1.2.1</span>

  <!-- ====================================================================
       SCRIPT : toute la logique de l'appli
       ==================================================================== -->
  <script>
  "use strict"; // mode strict : JavaScript signale plus d'erreurs (bon réflexe)

  /* ==================================================================
     1) CONFIG  —  LE SEUL BLOC À MODIFIER POUR PERSONNALISER
     ================================================================== */
  const CONFIG = {
    // --- Position pour la météo (par défaut : secteur Paris-Saclay) ---
    // Trouve tes coordonnées sur https://www.latlong.net si besoin.
    latitude:  48.71,
    longitude: 2.17,
    ville:     "Paris-Saclay",

    // --- Vacances scolaires à venir (Zone C : Paris / Versailles) ---
    // Dates de DÉBUT. Le compte à rebours vise automatiquement la
    // prochaine date encore à venir dans cette liste.
    // ⚠️ À vérifier/mettre à jour chaque année (format AAAA-MM-JJ).
    vacances: [
      { nom: "Vacances de Noël",      date: "2026-12-19" },
      { nom: "Vacances d'hiver",      date: "2027-02-20" },
      { nom: "Vacances de printemps", date: "2027-04-17" },
      { nom: "Vacances d'été",        date: "2027-07-03" }
    ],

    // --- Pense-bête (démo) : sera remplacé plus tard par le NAS ---
    corvees: [
      "Poules chez Monique ce week-end 🐔",
      "Rendre les livres à la médiathèque",
      "Sortir les poubelles jaunes dimanche soir"
    ]
  };

  /* ==================================================================
     2) HORLOGE + DATE
     ------------------------------------------------------------------
     On met à jour l'heure chaque seconde. La date, elle, est formatée
     joliment en français grâce à l'API Intl du navigateur.
     ================================================================== */
  function majHorloge() {
    const maintenant = new Date();

    // Heure au format HH:MM (padStart ajoute un 0 devant si besoin)
    const h = String(maintenant.getHours()).padStart(2, "0");
    const m = String(maintenant.getMinutes()).padStart(2, "0");
    // innerHTML (et pas textContent) car on glisse un <span> pour colorer les ":"
    document.getElementById("heure").innerHTML = `${h}<span class="sec">:</span>${m}`;

    // Date complète : "dimanche 25 octobre 2026"
    const dateTexte = maintenant.toLocaleDateString("fr-FR", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    document.getElementById("date-complete").textContent = dateTexte;

    // Salutation qui change selon l'heure
    const heure = maintenant.getHours();
    let salut = "Bonne nuit la famille";
    if (heure >= 6  && heure < 12) salut = "Bonjour la famille";
    else if (heure >= 12 && heure < 18) salut = "Bon après-midi la famille";
    else if (heure >= 18 && heure < 23) salut = "Bonne soirée la famille";
    document.getElementById("salutation").textContent = salut;
  }

  /* ==================================================================
     3) MÉTÉO  —  via Open-Meteo (API gratuite, sans clé, CORS OK)
     ------------------------------------------------------------------
     On demande : la température actuelle + les prévisions sur 4 jours.
     Les "weather_code" renvoyés sont des codes OMM qu'on traduit en
     emoji + texte avec la petite fonction codeMeteo() ci-dessous.
     ================================================================== */

  // Traduction d'un code météo OMM en { icone, texte }
  function codeMeteo(code) {
    // Table simplifiée des principaux cas
    const table = {
      0:  ["☀️", "Ciel dégagé"],
      1:  ["🌤️", "Plutôt dégagé"],
      2:  ["⛅", "Partiellement nuageux"],
      3:  ["☁️", "Couvert"],
      45: ["🌫️", "Brouillard"],
      48: ["🌫️", "Brouillard givrant"],
      51: ["🌦️", "Bruine légère"],
      53: ["🌦️", "Bruine"],
      55: ["🌧️", "Bruine forte"],
      61: ["🌦️", "Pluie faible"],
      63: ["🌧️", "Pluie"],
      65: ["🌧️", "Forte pluie"],
      71: ["🌨️", "Neige faible"],
      73: ["❄️", "Neige"],
      75: ["❄️", "Forte neige"],
      80: ["🌦️", "Averses"],
      81: ["🌧️", "Averses"],
      82: ["⛈️", "Fortes averses"],
      95: ["⛈️", "Orage"],
      96: ["⛈️", "Orage + grêle"]
    };
    return table[code] || ["🌡️", "—"]; // valeur par défaut si code inconnu
  }

  // Appel de l'API et affichage. async/await = code asynchrone lisible.
  async function chargerMeteo() {
    // On construit l'URL avec les coordonnées de la CONFIG
    const url = "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
      + "&current=temperature_2m,weather_code"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min"
      + "&timezone=Europe%2FParis&forecast_days=4";

    try {
      const reponse = await fetch(url);
      if (!reponse.ok) throw new Error("réponse réseau " + reponse.status);
      const data = await reponse.json();

      // --- Météo actuelle ---
      const [iconeNow, texteNow] = codeMeteo(data.current.weather_code);
      const tempNow = Math.round(data.current.temperature_2m);

      // --- Prévisions des prochains jours ---
      // On fabrique un petit bloc HTML par jour, puis on les assemble.
      let joursHTML = "";
      for (let i = 0; i < data.daily.time.length; i++) {
        const jour = new Date(data.daily.time[i]);
        const nomJour = jour.toLocaleDateString("fr-FR", { weekday: "short" });
        const [ic] = codeMeteo(data.daily.weather_code[i]);
        const tmax = Math.round(data.daily.temperature_2m_max[i]);
        const tmin = Math.round(data.daily.temperature_2m_min[i]);
        joursHTML += `
          <div class="meteo-jour">
            <div class="j">${nomJour}</div>
            <div class="i">${ic}</div>
            <div class="t-max">${tmax}°</div>
            <div class="t-min">${tmin}°</div>
          </div>`;
      }

      // Injection dans la carte météo
      document.getElementById("meteo-contenu").innerHTML = `
        <div class="meteo-actuel">
          <div class="meteo-icone">${iconeNow}</div>
          <div>
            <div class="meteo-temp">${tempNow}°</div>
            <div class="meteo-desc">${texteNow} · ${CONFIG.ville}</div>
          </div>
        </div>
        <div class="meteo-jours">${joursHTML}</div>`;

    } catch (e) {
      // En cas de souci (pas de réseau, API down…) on l'affiche proprement
      document.getElementById("meteo-contenu").innerHTML =
        `<div class="erreur">Météo indisponible (${e.message})</div>`;
    }
  }

  function majSaint() {
    const d = new Date();
    // on fabrique la clé "MM-JJ"
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const jj = String(d.getDate()).padStart(2, "0");
    const nom = SAINTS[`${mm}-${jj}`] || "—";
    document.getElementById("saint-nom").textContent = "St " + nom;
    document.getElementById("saint-info").textContent = "Bonne fête aux " + nom + " !";
  }

  /* ==================================================================
     5) COMPTE À REBOURS AVANT LES PROCHAINES VACANCES
     ------------------------------------------------------------------
     On parcourt la liste CONFIG.vacances, on garde la première date
     encore à venir, et on calcule le nombre de jours restants.
     ================================================================== */
  function majVacances() {
    const aujourdhui = new Date();
    aujourdhui.setHours(0, 0, 0, 0); // on ignore l'heure, on compare des jours

    // On cherche la prochaine date de vacances à venir
    let prochaine = null;
    for (const v of CONFIG.vacances) {
      const dateV = new Date(v.date + "T00:00:00");
      if (dateV >= aujourdhui) { prochaine = { ...v, dateObj: dateV }; break; }
    }

    const elNb    = document.getElementById("rebours-nb");
    const elLabel = document.getElementById("rebours-label");
    const elCible = document.getElementById("rebours-cible");

    if (!prochaine) {
      // Plus aucune date dans la liste -> penser à la mettre à jour
      elNb.textContent = "🎉";
      elLabel.textContent = "Liste des vacances à mettre à jour";
      elCible.textContent = "";
      return;
    }

    // Différence en jours : (date - aujourd'hui) / millisecondes par jour
    const msParJour = 1000 * 60 * 60 * 24;
    const joursRestants = Math.round((prochaine.dateObj - aujourdhui) / msParJour);

    elNb.textContent    = joursRestants === 0 ? "🎉" : joursRestants;
    elLabel.textContent = joursRestants <= 1 ? "jour" : "jours";
    const dateJolie = prochaine.dateObj.toLocaleDateString("fr-FR",
      { weekday: "long", day: "numeric", month: "long" });
    elCible.textContent = `${prochaine.nom} · ${dateJolie}`;
  }

  /* ==================================================================
     6) CORVÉES / PENSE-BÊTE (démo)
     ------------------------------------------------------------------
     Pour l'instant on lit simplement CONFIG.corvees. Plus tard, cette
     fonction ira chercher la liste sur le NAS (fetch vers une URL).
     ================================================================== */
  function majCorvees() {
    const ul = document.getElementById("liste-corvees");
    ul.innerHTML = ""; // on vide d'abord
    for (const tache of CONFIG.corvees) {
      const li = document.createElement("li");
      li.innerHTML = `<span class="puce"></span>${tache}`;
      ul.appendChild(li);
    }
  }

  /* ==================================================================
     7) SPÉCIAL TV SAMSUNG (Tizen)
     ------------------------------------------------------------------
     Ce bloc ne fait quelque chose QUE si la page tourne comme appli sur
     l'écran Samsung. Dans un navigateur normal, l'objet "tizen"
     n'existe pas : on ne fait rien et la page marche comme avant.
     ================================================================== */
  function preparerTV() {
    // typeof évite une erreur si "tizen" n'existe pas (navigateur classique)
    if (typeof tizen === "undefined") return;

    // --- Touche RETOUR de la télécommande = quitter l'appli ---
    // Sur Tizen, chaque touche a un code. "Retour" vaut 10009.
    // Sans ça, l'appui sur Retour ne ferait rien et on resterait coincé.
    document.addEventListener("keydown", (e) => {
      if (e.keyCode === 10009) {
        try { tizen.application.getCurrentApplication().exit(); } catch (err) {}
      }
    });

    // --- Empêcher l'économiseur d'écran ---
    // Un tableau de bord doit rester affiché. Samsung fournit pour ça la
    // bibliothèque "webapis", qu'on charge seulement ici (sur la TV) :
    // dans un navigateur, ce fichier n'existe pas et provoquerait une erreur.
    const s = document.createElement("script");
    s.src = "$WEBAPIS/webapis/webapis.js";   // chemin spécial reconnu par la TV
    s.onload = () => {
      try {
        webapis.appcommon.setScreenSaver(
          webapis.appcommon.AppCommonScreenSaverState.SCREEN_SAVER_OFF);
      } catch (err) { /* pas grave : l'écran se mettra juste en veille */ }
    };
    document.head.appendChild(s);
  }

  /* ==================================================================
     8) DÉMARRAGE  —  on lance tout et on programme les rafraîchissements
     ================================================================== */
  function init() {
    preparerTV();  // ne fait rien hors de la TV

    // Écran de lancement SV : on laisse le geste se dessiner (~0,9 s)
    // puis on le fait disparaître en fondu (classe .cache).
    setTimeout(() => {
      document.getElementById("lancement").classList.add("cache");
    }, 1200);

    majHorloge();  // horloge tout de suite…
    majSaint();
    majVacances();
    majCorvees();
    chargerMeteo();

    // …puis mises à jour régulières :
    setInterval(majHorloge, 1000);              // horloge chaque seconde
    setInterval(chargerMeteo, 30 * 60 * 1000);  // météo toutes les 30 min
    // Le saint et les vacances changent une fois par jour : on les
    // rafraîchit toutes les heures, suffisant et sans coût.
    setInterval(() => { majSaint(); majVacances(); }, 60 * 60 * 1000);
  }

  // On attend que la page soit prête avant de lancer init()
  document.addEventListener("DOMContentLoaded", init);
  </script>
